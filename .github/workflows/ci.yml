name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm content:check
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Smoke test against the production build
        env:
          NODE_ENV: production
          AI_PROVIDER: rules
          PGLITE_DATA_DIR: /tmp/seniorseat-ci
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          # Throwaway value for this run only, so no secret-like literal lives in the repo.
          HASH_SECRET=$(openssl rand -hex 32)
          export HASH_SECRET
          node_modules/.bin/next start -H 127.0.0.1 -p 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused \
            --output /dev/null http://127.0.0.1:3000/api/health
          BASE_URL=http://127.0.0.1:3000 pnpm smoke
      - name: Verify migrations and the production journey on PostgreSQL 17
        run: pnpm smoke:postgres

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest detect --source /repo --gitleaks-ignore-path /repo/.gitleaksignore --redact --verbose
