name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm content:check
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Smoke test against the production build
        env:
          NODE_ENV: production
          AI_PROVIDER: rules
          PGLITE_DATA_DIR: /tmp/seniorseat-ci
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          # Throwaway value for this run only, so no secret-like literal lives in the repo.
          export HASH_SECRET="$(openssl rand -hex 32)"
          pnpm start -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          BASE_URL=http://localhost:3000 pnpm smoke

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest detect --source /repo --gitleaks-ignore-path /repo/.gitleaksignore --redact --verbose
