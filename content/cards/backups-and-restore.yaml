slug: backups-and-restore
version: 2
updated: "2026-11-22"
status: draft
title: What if your data disappears?
domain: reliability-operations
chapter: first-100-users
minRank: shipper
decisionIds: [ro-backups]

question: If your database were deleted or corrupted tonight, how much would you lose, and how long would it take to get it back?

moment: >-
  When real people start depending on the app. The first customer order is the moment backups
  stop being optional.

ifSilent: >-
  Backups are rarely part of the AI's plan unless you ask, and free database tiers may keep few or
  none. A mistaken migration, a bad AI edit or a deleted table can then erase every customer record
  with no way back.

options:
  - key: managed-pitr
    label: Managed backups with point-in-time recovery
    recommended: true
    summary: >-
      Use your database provider's automatic backups and point-in-time recovery, which can restore
      the database to a moment just before the mistake.
    pros:
      - The provider runs backup and log collection
      - Recovers from mistakes, not only from hardware failures
    cons:
      - Usually needs a paid plan
      - Only as good as your last tested restore
    cost: Check the plan's recovery window, backup charges and cost of a restored instance.
    effort: Low
    promptLine: >-
      Enable managed backups and point-in-time recovery. Record the recovery window and the
      latest restorable time in RUNBOOK.md. Practise restoring to a chosen time in a new instance.

  - key: scheduled-exports
    label: Scheduled exports you control
    summary: >-
      A scheduled job exports the database to separate storage and keeps copies for a set number
      of days. For Postgres, pg_dump takes a consistent snapshot of one database.
    pros:
      - You choose where to keep copies and how long to keep them
      - A Postgres dump can be restored to another compatible Postgres instance
    cons:
      - You maintain the job and must notice when it fails
      - A restore loses everything since the last export
    cost: Low storage costs for small apps.
    effort: Medium
    promptLine: >-
      Schedule a Postgres dump at an interval that fits our loss target. Encrypt the stored copy,
      set a retention period and alert us on a missed export. Test restoring it into an empty database.

  - key: both
    label: Both, for important data
    summary: >-
      Managed point-in-time recovery for quick fixes, plus independent exports in case you lose
      access to the provider account itself.
    pros:
      - Gives you a second recovery path if the database account is unavailable
    cons:
      - Two systems to monitor
      - More setup time
    cost: A paid database plan plus storage.
    effort: Medium
    promptLine: >-
      Enable managed point-in-time recovery AND a nightly encrypted export to storage owned by a
      different account. Test a restore from each one monthly and record how long it took in RUNBOOK.md.

proveIt:
  steps:
    - Use a practice database with fictional orders. Set two limits before starting, one for lost work and one for time to reopen the app.
    - Save order A and record the time. Take an export, or choose a point after A for managed recovery. Wait for the export to finish or the provider to confirm that point is restorable.
    - Save order B after that recovery point. Note the time of the pretend interruption and start a timer.
    - Follow the runbook. Import the export into an empty database, or ask the provider to restore the selected time to a new instance. Open a test app against the restored destination. If you chose both methods, test each separately.
  passWhen: >-
    The restored app shows A and has no B. The practice source still has both. Record the gap
    from the recovery point to the pretend interruption and the elapsed time until the restored
    app works. The plan meets your targets if both times fit the limits you set.

depths:
  story: >-
    A photographer who keeps every wedding album on one laptop is one spilled coffee from disaster.
    A backup is the second copy in another building, and a restore drill is checking that the second
    copy actually opens.
  practical: >-
    Check your provider's settings to see when the last backup succeeded and which dates you can
    recover. Follow the restore instructions in a practice environment. Open the recovered order
    list before you stop the timer.
  technical: >-
    Your recovery point objective (RPO) sets how much recent work you can afford to lose.
    Your recovery time objective (RTO) sets how long the service can be unavailable. A missed
    daily export can leave a gap longer than a day. Postgres point-in-time recovery needs a base
    backup and an unbroken series of archived log records through the chosen time.
  engineer: >-
    Enable point-in-time recovery, keep logical dumps in separate storage with retention and
    encryption, and monitor the backup jobs. Restore into an isolated instance on a schedule and check
    records on both sides of the recovery point. A single pg_dump does not include cluster roles
    or files in a separate upload service. Include the dependencies your app needs in the recovery drill.
  senior: >-
    Backups are defined by tested restores, not by settings. Set RPO and RTO from business impact, keep
    at least one copy outside the primary provider account to survive compromise or lockout, and
    rehearse restores like fire drills. Pair them with controls that prevent the incident in the first
    place: least-privilege database roles, deletion protection and reviewed production changes.

related: [where-data-lives, where-secrets-live]

