slug: who-sees-what
version: 2
updated: "2026-11-22"
status: draft
title: Who can see whose data?
domain: identity-access
chapter: first-build
minRank: builder
decisionIds: [ia-row-access, ia-login, ss-privacy]

question: Can one customer see another customer's orders, messages or profile?

moment: >-
  When you add accounts or publish your first shared list. Decide who can read each kind of
  record, who can change it and which actions require sign-in. Name the sign-in method, such as
  an email link, and the personal fields you actually need.

ifSilent: >-
  An order page may show only the signed-in customer's purchases even though the data service
  allows a wider read. The rule that makes an order private has to hold where the data is served.
  On a public directory, the same decision separates a published listing from its owner's private details.

options:
  - key: own-rows-only
    label: Each user sees only their own data
    recommended: true
    summary: >-
      Each private order records its owner. Database policies limit what signed-in customers can
      read or change. Give staff a separate role if their work requires wider access.
    pros:
      - Ordinary customer queries share the same database rules across pages
      - Works for apps that query the database from the browser
    cons:
      - Every new table needs its own policy
      - Policies need tests, or a typo silently blocks or opens access
    cost: Included in Postgres. Budget time to write and maintain the policies.
    effort: Medium
    promptLine: >-
      Enable row-level security on exposed private tables. Limit reads and permitted writes to the
      signed-in owner, including the ownership of new and updated rows. Test with two ordinary
      accounts and a signed-out visitor. Give staff only the access their tasks require.

  - key: server-checks
    label: All data goes through your own server
    summary: >-
      The browser never talks to the database. Your API checks who is asking before every query.
    pros:
      - One place to check permissions and validate input
      - Database credentials never reach the browser
    cons:
      - More code to write and maintain
      - Every endpoint must remember to check ownership
    cost: Include API requests and server time in your hosting estimate.
    effort: Medium
    promptLine: >-
      Route private orders through our API. Take the owner of a new order from the signed-in
      session. Check ownership on the server before reading, updating or deleting an order.
      Test the allowed and denied actions with two ordinary accounts.

  - key: public-by-design
    label: Public on purpose
    summary: >-
      Content anyone may read, such as a directory or a blog, with editing limited to each author.
    pros:
      - Simple when nothing is private
    cons:
      - Easy to add a private field later and forget it is public
      - Customer orders and private contact details need separate protection
    cost: Public reads count toward your database or hosting usage.
    effort: Low
    promptLine: >-
      Records in [table] are public to read. Only the author can create, edit or delete their own
      records, enforced by the database. Keep personal details such as email addresses in a separate
      table that is never public.

proveIt:
  steps:
    - In a test project, list the fields each person may see and the changes they may make. Use two ordinary test accounts and fictional records.
    - For private orders, run your policy or API tests. The owner can read the order and make an allowed change. The other customer and the signed-out visitor have neither permission.
    - For a directory, check that a signed-out visitor can read the published fields, private details stay hidden, and only the signed-in author can edit their listing.
    - Follow your app's deletion process for one test customer. Check that their personal fields are removed as promised and the other account keeps its records.
  passWhen: >-
    The tests match every allowed and denied action in your list, including a successful owner
    change. For a public directory they also confirm what a visitor can read without signing in.
    The deletion check affects only the test customer's data.

depths:
  story: >-
    Your shop keeps every customer's order slip in one big drawer. Logging in is the front door: it
    decides who comes in. Row access is the drawer lock that lets each customer take out only their
    own slips. A front door without drawer locks still lets every customer read everyone's orders.
  practical: >-
    Write one sentence per kind of record. For example, customers can see their own orders,
    everyone can read the shop's published menu, and only the shop owner can edit that menu.
    Give those sentences to the person building and testing the app.
  technical: >-
    Authentication establishes identity. Authorisation limits what that identity may do. With
    Supabase's Data API, grants control table operations and row-level security policies restrict
    the rows an ordinary client may access. A publishable key identifies the app, and the user's
    session supplies the signed-in identity.
  engineer: >-
    Grant each role only the operations it needs. Test reads, inserts, updates and deletes under
    the same roles the app uses. A Supabase secret key can bypass row-level security when used
    with its service role. Keep that credential on the server and check authorisation before
    performing privileged operations.
  senior: >-
    Treat tenant isolation as an invariant, not a feature: enforce it at the lowest layer you control
    and test it in CI so nobody can forget it. Choose the isolation model deliberately (rows, schemas
    or separate databases per customer) based on compliance needs and blast radius, and keep an audit
    log of staff access to customer data.

