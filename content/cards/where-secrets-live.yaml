slug: where-secrets-live
version: 2
updated: "2026-11-22"
status: draft
title: Where do your keys live?
domain: security-secrets
chapter: launch
minRank: builder
decisionIds: [ss-secrets]

question: Where are your API keys, database passwords and payment secrets kept?

moment: >-
  When your app connects to its first private or paid service: a database, a payment provider,
  an AI model or an email sender.

ifSilent: >-
  A secret pasted into code can reach a public repository or the JavaScript sent to every
  visitor. Whoever receives it may be able to spend money or read data using the permissions
  your provider attached to the key.

options:
  - key: server-env
    label: Server-side environment variables
    recommended: true
    summary: >-
      Secrets live in your hosting platform's environment settings and are read only by server
      code. The browser never sees them.
    pros:
      - Common on managed hosting platforms
      - Keys can be replaced without changing code
    cons:
      - The key can only be used from a server or serverless function
      - Must be set separately for preview and production
    cost: Check what your hosting plan includes.
    effort: Low
    promptLine: >-
      Keep every secret in server-side environment variables and read them only in server code. Never
      put a secret in front-end code, in a variable exposed to the browser, or in Git. Commit a
      .env.example with names only, and add a secret scan to CI.

  - key: secret-manager
    label: A dedicated secret manager
    summary: >-
      Store secrets in a vault such as AWS Secrets Manager, Doppler or 1Password, and inject them
      at deploy time.
    pros:
      - Central control, access logs and rotation
      - Scales to teams and many services
    cons:
      - Another service to set up and pay for
      - More than a first version usually needs
    cost: Check charges for stored secrets, access requests and team seats.
    effort: Medium
    promptLine: >-
      Load secrets from [secret manager] at deploy time and never store them in the repository or the
      front end. Give each environment its own keys and document how to rotate each one.

  - key: publishable-only
    label: Only publishable keys in the browser
    summary: >-
      Some providers explicitly issue browser keys, such as Stripe and Supabase publishable keys.
      For Supabase, access also depends on the user's session and the database grants and policies.
      If this integration also needs a private key, pair it with one of the server-side options.
    pros:
      - Lets the front end talk to those services directly
    cons:
      - Safe only with access rules or server checks behind them
      - Easy to confuse with secret keys that look similar
    cost: The provider may charge for the operations the app performs.
    effort: Low
    promptLine: >-
      Use only provider-designated publishable keys in the browser. Keep privileged operations and
      private credentials on the server. List each key by name, its purpose, its environment and
      whether the provider designates it public or secret. Keep values out of SPEC.md.

proveIt:
  steps:
    - Using names only, list the credentials for your test app. Check the provider's documentation for which may be sent to a browser.
    - For each private credential, check its entry in the server settings or vault you chose. Run the feature with test credentials and confirm that the privileged action runs on the server.
    - Run a secret scan of your own Git history and browser build with redacted output. Review any findings. If you discover an exposed private credential, revoke or rotate it with the provider.
    - For a browser-only integration, check each shipped key against the provider's publishable designation and test the intended browser action in the provider's test environment.
  passWhen: >-
    The test feature works with the documented key types. Every private credential has a named
    server-side home, every client key is designated publishable by its provider, and the scan
    has no unresolved private-key findings.

depths:
  story: >-
    API keys are the keys to your shop, your bank and your supplier. Taping them to the shop window
    (front-end code) or copying them into a public notebook (Git) lets anyone walking past make
    copies. Keep them in the back office, where only staff can reach them.
  practical: >-
    Give the builder the name of the setting it should read. Enter a private value in your host's
    server settings or the team's vault. If a private key was exposed, revoke or rotate it at the
    provider, update the app and check that the feature still works.
  technical: >-
    Visitors can read the JavaScript delivered to their browsers. Next.js can inline NEXT_PUBLIC_
    variables in that code. Vite exposes VITE_ variables to client code by default. Reserve these
    names for public settings, and keep secrets out of client responses and build logs too.
  engineer: >-
    Separate publishable keys from secret ones, keep secrets in per-environment server variables and
    use them only in server routes. Add a pre-commit or CI secret scan such as gitleaks, give each key
    the least privilege the service allows, set spending limits on AI and cloud accounts, and write a
    rotation runbook.
  senior: >-
    Assume every secret leaks eventually and make a leak cheap: scoped or short-lived credentials,
    spending caps, separate keys per environment and service, alerts on unusual usage, and rotation you
    have rehearsed. Where the platform supports it, prefer identity-based access (for example OIDC from
    CI to the cloud) over long-lived static keys.

