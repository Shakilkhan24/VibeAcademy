slug: one-job
version: 2
updated: "2026-11-22"
status: draft
title: Who is it for, and what is the one job?
domain: product-scope
chapter: dream
minRank: dreamer
decisionIds: [ps-audience, ps-scope-v1]

question: Who is this app for, and what is the one thing they must be able to do with it?

moment: >-
  Before your first prompt. Everything the AI builds will be shaped by this answer,
  or by its guess if you skip it.

ifSilent: >-
  Ask for a bakery app and you might get a shop, a recipe book or a dashboard. A builder
  could finish any of those while the baker still has to sort tomorrow's pickups by hand.

options:
  - key: one-user-one-job
    label: One user, one job
    recommended: true
    summary: >-
      Name a single primary user and the one task that must work perfectly.
      Everything else waits for version 2.
    pros:
      - A small first version you can actually test
      - Every screen has a clear purpose
      - Fewer prompts and less rework
    cons:
      - You say no to good ideas for now
      - Secondary users wait for version 2
    cost: You can sketch the job on paper and test it with someone who does it.
    effort: Low
    promptLine: >-
      Primary user: [who, e.g. busy parents ordering weekly meals]. The one job: [e.g. place a
      repeat order in under a minute]. Version 1 includes only what that job needs; list anything
      else as out of scope and ask me before adding it.

  - key: two-sided
    label: Two user types from the start
    summary: >-
      Build for both sides at once, for example buyers and sellers, or students and tutors.
      Only choose this when the product is useless without both.
    pros:
      - Necessary when value only exists with both sides
      - Makes the handoff between roles visible in the first test
    cons:
      - Each side needs screens and access rules, and the handoff needs testing
      - Much harder to test, launch and support
    cost: No money up front; more moderation and support work later.
    effort: High
    promptLine: >-
      Two user types: [type A] who need to [job A], and [type B] who need to [job B]. Build the
      smallest version of both jobs first, with separate roles, and ask me before adding anything else.

  - key: prototype-first
    label: A clickable prototype first
    summary: >-
      Do not build the real app yet. Ask the AI for a clickable prototype with fake data and
      watch people who do the job try it.
    pros:
      - Lets you try different screens using sample data
      - Can be tested before you set up accounts or a database
    cons:
      - Not a real product; you will rebuild it
      - Easy to mistake a demo for a launch
    cost: Paper takes basic supplies. A clickable tool may charge for sharing or collaboration.
    effort: Low
    promptLine: >-
      Build a clickable prototype only: no real accounts, payments or database, and use fake sample
      data. Label it clearly as a prototype. The goal is to test whether [who] understands how to [job].

proveIt:
  steps:
    - Name the person, the task and what a finished result looks like.
    - Give someone who does that job a realistic example to try on paper, in the prototype or in the app. For a two-sided product, give the second participant the result of the first participant's task.
    - Watch where each person stops or asks for help. Write down what they actually produced at the end.
  passWhen: >-
    Each participant reaches the result you described without coaching. If the job needs two sides,
    the second person can use what the first person produced.

depths:
  story: >-
    A food stall that sells one dish very well beats a stall with a forty-item menu and a
    confused cook. Your app is the stall. Decide the dish first, then the kitchen, then the
    decorations.
  practical: >-
    Write one sentence: who the app is for and the one thing they must be able to do. Paste it
    at the top of every prompt. When the AI suggests extra features, ask whether the one job
    needs them. If not, put them on a later list instead of building them.
  technical: >-
    This is scope definition: a primary persona, a core user journey and explicit non-goals.
    Written scope gives the AI acceptance criteria to test against and prevents scope creep,
    where each prompt adds features nobody asked for.
  engineer: >-
    Turn the one job into a user story with acceptance criteria, for example: given a returning
    customer, when they tap reorder, then last week's order is placed and confirmed. Make the
    criteria end-to-end tests, and keep non-goals in SPEC.md so the agent checks proposals against
    them instead of re-deciding scope in every session.
  senior: >-
    Scope is the strongest cost control you have: every feature adds data, permissions, states and
    support load that compound later. Protect the core loop, ship it to real users and let usage
    choose version 2. Two-sided products are the classic exception: if value only exists with both
    sides, cut each side's job to the minimum and solve getting both sides on board before adding features.

